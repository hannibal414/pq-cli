[project]
name = "pqcli"
version = "1.1.0"
description = "Progress Quest: the CLI edition, with Japanese localization"
authors = [{ name = "Laura Kurczewska", email = "dash@wind.garden" }]
maintainers = [{ name = "hannibal414", email = "207813470+hannibal414@users.noreply.github.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Environment :: Console",
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "xdg-base-dirs>=6.0.0,<7.0.0",
    "wcwidth>=0.2.5,<1.0.0",
]

[project.optional-dependencies]
windows = ["windows-curses>=2.3.0,<3.0.0"]

[project.urls]
Repository = "https://github.com/hannibal414/pq-cli.git"
"Upstream project" = "https://github.com/rr-/pq-cli"

[project.scripts]
pqcli = "pqcli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pre-commit>=4.5.0", "babel>=2.14.0"]

[tool.hatch.build.targets.wheel]
packages = ["pqcli"]
artifacts = ["pqcli/locale/**/*.mo"]

[tool.hatch.build.targets.sdist]
artifacts = ["pqcli/locale/**/*.mo"]

[tool.black]
line-length = 79

[tool.isort]
known_first_party = "pqcli"
multi_line_output = 3
include_trailing_comma = true
